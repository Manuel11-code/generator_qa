# =============================================================================
# Nginx – Server block HTTP (puerto 80)
# Proxy reverso hacia Gunicorn + servidor de archivos estáticos
# =============================================================================

server {
    listen 80;
    server_name localhost;          # Cambia a tu dominio real cuando lo tengas

    # ------------------------------------------------------------------
    # Archivos estáticos de Django (collectstatic los vuelca aquí)
    # Nginx los sirve directamente sin pasar por Gunicorn.
    # ------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Let's Encrypt: validación de dominio HTTP-01 challenge
    # Certbot escribe aquí los tokens de validación.
    # Activa esto ANTES de pedir el primer certificado.
    # ------------------------------------------------------------------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ------------------------------------------------------------------
    # Todo lo demás → Gunicorn (servicio "web" en el puerto 8000)
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;

        # Timeouts recomendados para aplicaciones Django
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}


# =============================================================================
# BLOQUE HTTPS – DESACTIVADO (comentado)
# =============================================================================
# Activa este bloque SOLO cuando:
#   1. Tengas un dominio real apuntando a la IP de tu servidor.
#   2. Hayas generado los certificados con:
#        docker compose run --rm certbot certonly --webroot \
#          --webroot-path /var/www/certbot \
#          --email tu@email.com \
#          --agree-tos --no-eff-email \
#          -d tu-dominio.com -d www.tu-dominio.com
#   3. Los archivos existan en ./certbot/conf/live/<tu-dominio>/
#
# Pasos para activar:
#   - Reemplaza "tu-dominio.com" por tu dominio real en todo el bloque.
#   - Descomenta el bloque completo (quita los '#').
#   - En el bloque HTTP de arriba, añade una redirección 301 a HTTPS:
#       return 301 https://$host$request_uri;
#   - Recarga Nginx: docker compose exec nginx nginx -s reload
# =============================================================================

