<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'analyzer/base.html' %}
{% block content %}

<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Analizar Código 🔍</h2>
    <p class="text-gray-500 mt-1">Pega tu código, elige el área y la IA lo analizará</p>
</div>

<div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6">
    <form method="POST" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Área del código</label>
            <div class="grid grid-cols-3 gap-3">
                <label class="cursor-pointer">
                    <input type="radio" name="area" value="finanzas" class="hidden peer" required>
                    <div class="border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 rounded-xl p-4 text-center transition">
                        <div class="text-2xl">💰</div>
                        <div class="font-medium text-gray-700 mt-1">Finanzas</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="area" value="salud" class="hidden peer">
                    <div class="border-2 border-gray-200 peer-checked:border-green-500 peer-checked:bg-green-50 rounded-xl p-4 text-center transition">
                        <div class="text-2xl">🏥</div>
                        <div class="font-medium text-gray-700 mt-1">Salud Digital</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="area" value="tecnologia" class="hidden peer">
                    <div class="border-2 border-gray-200 peer-checked:border-purple-500 peer-checked:bg-purple-50 rounded-xl p-4 text-center transition">
                        <div class="text-2xl">💻</div>
                        <div class="font-medium text-gray-700 mt-1">Tecnología</div>
                    </div>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Código a analizar</label>
            <textarea name="codigo" rows="16"
                placeholder="Pega aquí el código que quieres analizar..."
                class="w-full border border-gray-300 rounded-xl px-4 py-3 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" required></textarea>
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition text-lg">
            🤖 Analizar con IA
        </button>
    </form>
</div>

{% endblock %}
</body>
</html>
